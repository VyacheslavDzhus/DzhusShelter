name: Build and Push Docker Images

on:
  push:
    branches: [main]

env:
  DOCKERHUB_NAMESPACE: "1928374650810"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: src/DzhusShelter.Api/Dockerfile
          - service: ui
            dockerfile: src/DzhusShelter.UI/Dockerfile
          - service: bot
            dockerfile: src/DzhusShelter.TelegramBot/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/dzhusshelter-${{ matrix.service }}:latest
