name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DzhusShelter.slnx

      - name: Build
        run: dotnet build DzhusShelter.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DzhusShelter.slnx --no-build --configuration Release
