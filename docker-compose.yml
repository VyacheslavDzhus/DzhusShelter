services:
  ui:
    image: 1928374650810/dzhusshelter-ui:latest
    container_name: dzhusshelter-ui
    ports:
      # Bound to 127.0.0.1 only: the CasaOS host's existing Cloudflare Tunnel
      # (host network mode, used for Home Assistant) reaches this locally —
      # nothing on the LAN or internet can hit it directly except through
      # that tunnel. See docs/specs/public-access-and-auth.md.
      - "127.0.0.1:8082:8080"
    environment:
      - Api__BaseUrl=http://api:8080
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: 1928374650810/dzhusshelter-api:latest
    container_name: dzhusshelter-api
    ports:
      # Bound to 127.0.0.1 only — same reasoning as ui above. Still never
      # reachable from the LAN/internet without going through the tunnel,
      # where auth (this file's Auth__*/Jwt__* env vars) is required.
      - "127.0.0.1:5279:8080"
    environment:
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=dzhusshelter;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Auth__AdminPasswordHash=${ADMIN_PASSWORD_HASH}
      - Auth__ApiKeyBot=${API_KEY_BOT}
      - Auth__ApiKeyShortcuts=${API_KEY_SHORTCUTS}
      - Auth__ApiKeyMainBot=${API_KEY_MAIN_BOT}
    depends_on:
      - postgres
    restart: unless-stopped

  main-bot:
    # Outbound-only (polls the API, sends via Telegram) — no ports published.
    image: 1928374650810/dzhusshelter-main-bot:latest
    container_name: dzhusshelter-main-bot
    environment:
      - Telegram__BotToken=${TELEGRAM_MAIN_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_ALLOWED_CHAT_ID}
      - Api__BaseUrl=http://api:8080
      - Api__ApiKey=${API_KEY_MAIN_BOT}
    depends_on:
      - api
    restart: unless-stopped

  bot:
    image: 1928374650810/dzhusshelter-bot:latest
    container_name: dzhusshelter-bot
    environment:
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__AllowedChatId=${TELEGRAM_ALLOWED_CHAT_ID}
      - Api__BaseUrl=http://api:8080
      - Api__ApiKey=${API_KEY_BOT}
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dzhusshelter-postgres
    environment:
      - POSTGRES_DB=dzhusshelter
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # Published for local dev (running the API/bot with `dotnet run` outside
      # Docker needs to reach Postgres at localhost) — unlike the api service,
      # nothing in docs/architecture.md restricts exposing Postgres itself.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backup:
    # Same image as postgres so pg_dump/pg_restore always match the server's major version.
    # The entrypoint is overridden: we only want the client tools, not a second database.
    # Weekly dump, newest 3 kept — see ops/postgres-backup/backup.sh and docs/casaos-runbook.md.
    image: postgres:16-alpine
    container_name: dzhusshelter-backup
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      - PGHOST=postgres
      - PGUSER=postgres
      - PGDATABASE=dzhusshelter
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./ops/postgres-backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data:
